<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlickEd - Diagnostic Scanner (Local Lib)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <!-- Nạp trực tiếp từ thư mục lib nội bộ trên cùng repo GitHub -->
  <script src="./lib/cv.js"></script>
  <script src="./lib/aruco.js"></script>
  <script src="./lib/aruco_mip_36h12.js"></script>
  <script src="./lib/aruco_4x4_1000.js"></script>
  <style>
    #debug-console::-webkit-scrollbar { width: 4px; }
    #debug-console::-webkit-scrollbar-thumb { background: #4b5563; }
  </style>
</head>
<body class="bg-black text-white h-[100dvh] flex flex-col font-sans overflow-hidden select-none">

  <!-- TOP HUD -->
  <div class="p-2 bg-slate-900/95 border-b border-slate-700 grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px] font-mono z-20 shadow-lg">
    <div class="bg-slate-800 p-1.5 rounded flex flex-col">
      <span class="text-slate-400">FPS / AI Latency</span>
      <span id="metric-fps" class="text-green-400 font-bold text-sm">-- FPS / -- ms</span>
    </div>
    <div class="bg-slate-800 p-1.5 rounded flex flex-col">
      <span class="text-slate-400">Ô vuông bắt được</span>
      <span id="metric-cand" class="text-cyan-400 font-bold text-sm">0 khung</span>
    </div>
    <div class="bg-slate-800 p-1.5 rounded flex flex-col">
      <span class="text-slate-400">Ánh sáng (Luma)</span>
      <span id="metric-light" class="text-yellow-400 font-bold text-sm">Đang đo...</span>
    </div>
    <div class="bg-slate-800 p-1.5 rounded flex flex-col">
      <span class="text-slate-400">Chuẩn Mã Đang Quét</span>
      <select id="dict-select" onchange="changeDictionary(this.value)" class="bg-slate-700 text-amber-300 font-bold text-xs rounded px-1 py-0.5 mt-0.5 outline-none">
        <option value="ARUCO_MIP_36h12">MIP_36h12 (Mặc định)</option>
        <option value="ARUCO_4X4_1000">4x4_1000 (OpenCV 4x4)</option>
        <option value="ARUCO">ARUCO Gốc (7x7)</option>
      </select>
    </div>
  </div>

  <!-- MAIN VIEWPORT -->
  <div class="relative flex-1 bg-slate-950 flex items-center justify-center overflow-hidden">
    <video id="webcam" autoplay playsinline muted webkit-playsinline class="w-full h-full object-contain"></video>
    <canvas id="overlay-canvas" class="absolute inset-0 w-full h-full object-contain pointer-events-none"></canvas>

    <!-- PiP Threshold -->
    <div class="absolute top-2 right-2 w-36 h-28 bg-black border-2 border-red-500 rounded flex flex-col items-center z-10 pointer-events-none shadow-2xl">
      <span class="text-[9px] text-white bg-red-600 w-full text-center uppercase tracking-wider font-bold">Lõi AI Threshold</span>
      <canvas id="threshold-canvas" class="w-full h-full object-contain"></canvas>
    </div>

    <!-- Nút điều khiển -->
    <div class="absolute bottom-3 left-3 right-3 flex justify-between items-center z-20">
      <button onclick="toggleTestCard()" class="bg-amber-600/90 hover:bg-amber-500 px-3 py-2.5 rounded-full text-xs text-white font-bold backdrop-blur shadow-lg">
        🪪 Mở Thẻ Mẫu Test
      </button>
      <button id="btn-switch-cam" onclick="cycleCamera()" class="bg-blue-600/90 hover:bg-blue-500 px-4 py-2.5 rounded-full text-xs text-white font-bold backdrop-blur shadow-lg">
        🔄 Đổi Cam (<span id="cam-index-lbl">Auto</span>)
      </button>
    </div>

    <!-- Popup Thẻ Mẫu -->
    <div id="test-card-modal" class="hidden absolute inset-0 bg-black/90 z-30 flex flex-col items-center justify-center p-4">
      <div class="bg-white p-6 rounded-xl flex flex-col items-center shadow-2xl">
        <p class="text-black font-bold text-sm mb-2">Thẻ chuẩn ID #1 (Mở trên thiết bị khác để quét)</p>
        <div id="sample-marker-svg" class="w-56 h-56 flex items-center justify-center border border-slate-300 p-3 bg-white"></div>
        <button onclick="toggleTestCard()" class="mt-4 bg-red-600 text-white px-6 py-2 rounded-full font-bold text-sm">Đóng lại</button>
      </div>
    </div>

    <!-- Màn chắn Bắt đầu -->
    <div id="start-overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center z-40 backdrop-blur-sm">
      <h2 class="text-2xl font-bold text-white mb-2">Chẩn Đoán Nhận Diện Mã</h2>
      <p id="lib-check-msg" class="text-slate-400 text-sm mb-6 max-w-xs">Đang kiểm tra thư viện nội bộ...</p>
      <button onclick="initInspection()" class="bg-green-600 hover:bg-green-500 text-white font-bold text-lg px-8 py-4 rounded-full shadow-lg shadow-green-500/20">
        Bắt Đầu Quét
      </button>
    </div>
  </div>

  <!-- BOTTOM HUD -->
  <div class="h-32 bg-slate-950 border-t-2 border-slate-800 flex flex-col z-20">
    <div class="bg-slate-900 px-2 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-widest flex justify-between items-center">
      <span>Live Console</span>
      <span id="marker-status" class="text-slate-400">Chờ khởi động...</span>
    </div>
    <div id="debug-console" class="flex-1 overflow-y-auto p-2 text-[11px] font-mono space-y-1"></div>
  </div>

  <script>
    const consoleDiv = document.getElementById('debug-console');
    function logToScreen(msg, type = 'info') {
      const el = document.createElement('div');
      const time = new Date().toLocaleTimeString('vi-VN', { hour12: false });
      let color = 'text-slate-300';
      if (type === 'error') color = 'text-red-400 font-bold';
      if (type === 'warn') color = 'text-yellow-400';
      if (type === 'success') color = 'text-green-400 font-bold';

      el.className = `border-b border-slate-800/50 pb-0.5 ${color}`;
      el.innerText = `[${time}] ${msg}`;
      consoleDiv.appendChild(el);
      if (consoleDiv.childNodes.length > 60) consoleDiv.removeChild(consoleDiv.firstChild);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    window.addEventListener('error', e => logToScreen(`JS Error: ${e.message}`, 'error'));

    // Kiểm tra ngay lúc mở trang xem ./lib/cv.js và ./lib/aruco.js đã nạp thành công chưa
    window.addEventListener('DOMContentLoaded', () => {
      const msgEl = document.getElementById('lib-check-msg');
      if (typeof CV !== 'undefined' && typeof AR !== 'undefined') {
        const dicts = Object.keys(AR.DICTIONARIES || {}).join(', ');
        msgEl.innerHTML = `<span class="text-green-400 font-bold">✓ Thư viện AI cục bộ đã sẵn sàng!</span><br><span class="text-xs text-slate-400">Từ điển hỗ trợ: ${dicts}</span>`;
        logToScreen(`Nạp thành công thư viện cục bộ (${dicts})`, 'success');
      } else {
        msgEl.innerHTML = `<span class="text-red-400 font-bold">✗ Chưa thấy thư mục ./lib trên server!</span><br><span class="text-xs text-slate-400">Hãy chờ 30 giây để GitHub Pages cập nhật rồi tải lại trang.</span>`;
        logToScreen('Chưa tìm thấy biến AR/CV từ ./lib/', 'error');
      }
    });

    const video = document.getElementById('webcam');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const threshCanvas = document.getElementById('threshold-canvas');
    const threshCtx = threshCanvas.getContext('2d');

    const procCanvas = document.createElement('canvas');
    const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

    let currentStream = null, detector = null, videoDevices = [], camIndex = -1;
    let rafId = null, frameCount = 0, currentFps = 0, lastTime = performance.now();
    let audioCtx = null, lastBeepTime = 0, currentDict = 'ARUCO_MIP_36h12';
    let isSwitchingCam = false;

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    try {
      firebase.initializeApp({ databaseURL: "https://plicked-default-rtdb.asia-southeast1.firebasedatabase.app" });
      logToScreen("Firebase sẵn sàng.", "success");
    } catch(e) { logToScreen("Lỗi Firebase: " + e.message, "error"); }

    window.addEventListener('pagehide', releaseCameraHardware);
    window.addEventListener('beforeunload', releaseCameraHardware);

    async function releaseCameraHardware() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      if (currentStream) {
        currentStream.getTracks().forEach(track => {
          try { track.stop(); } catch(e) {}
        });
        currentStream = null;
      }
      video.pause();
      video.srcObject = null;
      await sleep(300);
    }

    function setupDetector(dictName) {
      try {
        if (typeof AR === 'undefined' || !AR.Detector) {
          logToScreen("LỖI: Biến AR chưa tồn tại. Hãy bấm Ctrl+F5 sau khi GitHub Pages build xong!", "error");
          return;
        }
        detector = new AR.Detector({ dictionaryName: dictName });
        currentDict = dictName;
        logToScreen(`Đang dùng bộ giải mã: ${dictName}`, "success");
        renderSampleCard();
      } catch (err) {
        logToScreen(`Lỗi nạp từ điển ${dictName}: ${err.message}`, "error");
      }
    }

    function changeDictionary(val) { setupDetector(val); }

    function toggleTestCard() {
      const modal = document.getElementById('test-card-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) renderSampleCard();
    }

    function renderSampleCard() {
      if (typeof AR === 'undefined' || !AR.Dictionary) return;
      try {
        const dict = new AR.Dictionary(currentDict);
        document.getElementById('sample-marker-svg').innerHTML = dict.generateSVG(1);
        const svgEl = document.querySelector('#sample-marker-svg svg');
        if (svgEl) { svgEl.setAttribute('width', '100%'); svgEl.setAttribute('height', '100%'); }
      } catch (e) {
        logToScreen("Lỗi vẽ thẻ mẫu: " + e.message, "warn");
      }
    }

    async function initInspection() {
      document.getElementById('start-overlay').classList.add('hidden');
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch(e) {}

      setupDetector(document.getElementById('dict-select').value);
      await startSelectedStream(true);
    }

    async function acquireStreamWithFallback(targetDeviceId) {
      const fallbackProfiles = [];

      if (targetDeviceId) {
        fallbackProfiles.push(
          { label: "Cam chỉ định (720p)", constraints: { audio: false, video: { deviceId: { exact: targetDeviceId }, width: { ideal: 1280 }, height: { ideal: 720 } } } },
          { label: "Cam chỉ định (Gốc)", constraints: { audio: false, video: { deviceId: { exact: targetDeviceId } } } }
        );
      } else {
        fallbackProfiles.push(
          { label: "Cam sau ưu tiên (720p)", constraints: { audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } } },
          { label: "Cam sau cơ bản", constraints: { audio: false, video: { facingMode: "environment" } } }
        );
      }
      fallbackProfiles.push({ label: "Chế độ an toàn (video: true)", constraints: { audio: false, video: true } });

      let lastErr = null;
      for (const profile of fallbackProfiles) {
        try {
          logToScreen(`Thử mở: ${profile.label}...`);
          return await navigator.mediaDevices.getUserMedia(profile.constraints);
        } catch (err) {
          lastErr = err;
          logToScreen(`Thất bại (${profile.label}): ${err.name}`, "warn");
          await sleep(350);
        }
      }
      throw lastErr;
    }

    async function startSelectedStream(useDefaultEnv = false) {
      await releaseCameraHardware();

      try {
        let targetId = null;
        if (!useDefaultEnv && videoDevices.length > 0 && camIndex >= 0 && videoDevices[camIndex]) {
          targetId = videoDevices[camIndex].deviceId;
        }

        const stream = await acquireStreamWithFallback(targetId);
        currentStream = stream;
        video.srcObject = stream;
        await video.play();

        const devices = await navigator.mediaDevices.enumerateDevices();
        videoDevices = devices.filter(d => d.kind === 'videoinput');

        if (videoDevices.length > 0) {
          const activeTrack = stream.getVideoTracks()[0];
          const activeId = activeTrack.getSettings ? activeTrack.getSettings().deviceId : null;
          const foundIdx = videoDevices.findIndex(d => d.deviceId === activeId);
          if (foundIdx >= 0) camIndex = foundIdx;
          else if (camIndex < 0) camIndex = 0;
        }

        document.getElementById('cam-index-lbl').innerText = videoDevices.length ? `${camIndex + 1}/${videoDevices.length}` : '1';
        logToScreen(`Đã kết nối Camera (${video.videoWidth}x${video.videoHeight})!`, "success");

        lastTime = performance.now();
        frameCount = 0;
        rafId = requestAnimationFrame(processFrame);
      } catch (err) {
        logToScreen(`LỖI PHẦN CỨNG: ${err.name} - ${err.message}`, "error");
      }
    }

    async function cycleCamera() {
      if (isSwitchingCam || videoDevices.length <= 1) return;
      isSwitchingCam = true;
      const btn = document.getElementById('btn-switch-cam');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      try {
        for (let attempt = 0; attempt < videoDevices.length; attempt++) {
          camIndex = (camIndex + 1) % videoDevices.length;
          const label = videoDevices[camIndex].label || `Camera #${camIndex + 1}`;
          logToScreen(`Chuyển sang: ${label}`);
          await releaseCameraHardware();

          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { deviceId: { exact: videoDevices[camIndex].deviceId } }
            });
            currentStream = stream;
            video.srcObject = stream;
            await video.play();
            document.getElementById('cam-index-lbl').innerText = `${camIndex + 1}/${videoDevices.length}`;
            logToScreen(`Đổi sang ${label} thành công!`, "success");
            rafId = requestAnimationFrame(processFrame);
            break;
          } catch (switchErr) {
            logToScreen(`Bỏ qua ống kính phụ (${switchErr.name})...`, "warn");
          }
        }
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
        isSwitchingCam = false;
      }
    }

    function processFrame() {
      const now = performance.now();
      frameCount++;
      if (now - lastTime >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastTime = now;
      }

      if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && detector) {
        if (overlayCanvas.width !== video.videoWidth || overlayCanvas.height !== video.videoHeight) {
          overlayCanvas.width = video.videoWidth;
          overlayCanvas.height = video.videoHeight;
        }

        const targetW = 640;
        const scale = video.videoWidth / targetW;
        const targetH = Math.round(video.videoHeight / scale);

        if (procCanvas.width !== targetW || procCanvas.height !== targetH) {
          procCanvas.width = targetW;
          procCanvas.height = targetH;
        }

        procCtx.drawImage(video, 0, 0, targetW, targetH);
        const imageData = procCtx.getImageData(0, 0, targetW, targetH);

        if (frameCount % 15 === 0) analyzeLighting(imageData);

        const t0 = performance.now();
        const markers = detector.detect(imageData);
        const cvTime = Math.round(performance.now() - t0);

        const candCount = detector.candidates ? detector.candidates.length : 0;
        document.getElementById('metric-cand').innerText = `${candCount} khung vuông`;
        document.getElementById('metric-fps').innerHTML = `${currentFps} FPS / ${cvTime}ms`;

        renderRealThreshold(detector.thres, targetW, targetH);
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        if (detector.candidates) {
          overlayCtx.strokeStyle = "rgba(250, 204, 21, 0.45)";
          overlayCtx.lineWidth = 2;
          detector.candidates.forEach(c => {
            overlayCtx.beginPath();
            overlayCtx.moveTo(c[0].x * scale, c[0].y * scale);
            for (let i = 1; i < c.length; i++) overlayCtx.lineTo(c[i].x * scale, c[i].y * scale);
            overlayCtx.closePath();
            overlayCtx.stroke();
          });
        }

        if (markers.length > 0) {
          const summary = markers.map(m => `#${m.id}`).join(', ');
          document.getElementById('marker-status').innerText = `ĐÃ NHẬN: ${summary}`;
          document.getElementById('marker-status').className = "text-black bg-green-400 px-2 rounded font-bold";

          markers.forEach(m => {
            const c = m.corners.map(pt => ({ x: pt.x * scale, y: pt.y * scale }));
            const dx = c[1].x - c[0].x;
            const dy = c[1].y - c[0].y;
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            let ans = 'A';
            if (angle >= 45 && angle < 135) ans = 'B';
            else if (angle >= 135 || angle < -135) ans = 'C';
            else if (angle >= -135 && angle < -45) ans = 'D';

            overlayCtx.beginPath();
            overlayCtx.strokeStyle = "#22c55e";
            overlayCtx.lineWidth = 6;
            overlayCtx.moveTo(c[0].x, c[0].y);
            for (let i = 1; i < c.length; i++) overlayCtx.lineTo(c[i].x, c[i].y);
            overlayCtx.closePath();
            overlayCtx.stroke();

            overlayCtx.fillStyle = "#ef4444";
            overlayCtx.beginPath();
            overlayCtx.arc(c[0].x, c[0].y, 8, 0, Math.PI * 2);
            overlayCtx.fill();

            overlayCtx.fillStyle = "#fde047";
            overlayCtx.font = "bold 28px monospace";
            overlayCtx.fillText(`ID:${m.id} [${ans}]`, c[0].x, Math.max(32, c[0].y - 14));
          });

          if (now - lastBeepTime > 600) {
            playBeep();
            lastBeepTime = now;
            logToScreen(`Quét thành công thẻ: ${summary}`, "success");
          }
        } else {
          document.getElementById('marker-status').innerText = candCount > 0 ? `Thấy ${candCount} ô vuông (Chưa khớp mã)` : `Đang tìm thẻ...`;
          document.getElementById('marker-status').className = candCount > 0 ? "text-amber-400" : "text-slate-500";
        }
      }
      rafId = requestAnimationFrame(processFrame);
    }

    function renderRealThreshold(thresObj, w, h) {
      if (!thresObj || !thresObj.data) return;
      if (threshCanvas.width !== 160 || threshCanvas.height !== 120) {
        threshCanvas.width = 160;
        threshCanvas.height = 120;
      }
      const img = threshCtx.createImageData(160, 120);
      const src = thresObj.data;
      for (let y = 0; y < 120; y++) {
        const sy = Math.floor(y * h / 120) * w;
        for (let x = 0; x < 160; x++) {
          const val = src[sy + Math.floor(x * w / 160)];
          const idx = (y * 160 + x) * 4;
          img.data[idx] = img.data[idx+1] = img.data[idx+2] = val;
          img.data[idx+3] = 255;
        }
      }
      threshCtx.putImageData(img, 0, 0);
    }

    function analyzeLighting(imageData) {
      const d = imageData.data;
      let sum = 0, count = 0;
      for (let i = 0; i < d.length; i += 400) {
        sum += (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114);
        count++;
      }
      const avg = Math.round(sum / count);
      const el = document.getElementById('metric-light');
      if (avg < 45) { el.innerText = `Quá Tối (${avg})`; el.className = "text-red-400 font-bold text-sm"; }
      else if (avg > 215) { el.innerText = `Chói/Lóa (${avg})`; el.className = "text-orange-400 font-bold text-sm"; }
      else { el.innerText = `Tốt (${avg})`; el.className = "text-green-400 font-bold text-sm"; }
    }

    function playBeep() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 920;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    }
  </script>
</body>
</html>
