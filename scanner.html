<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlickEd - Scanner Tablet Fix Cam 0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jsviz/jsaruco/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jsviz/jsaruco/src/aruco.js"></script>
  <link rel="manifest" href="./manifest-scanner.json">
  <link rel="icon" type="image/png" href="./icon.png">
  <script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between font-sans overflow-hidden">

  <!-- Header Section -->
  <div class="p-3 bg-slate-900 border-b border-slate-800 flex flex-col gap-2 z-10">
    <div class="flex justify-between items-center">
      <h1 class="text-base font-black text-green-400 flex items-center gap-1.5">
        <span>PlickEd Scanner</span>
        <span id="cam-status" class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span>
      </h1>
      <span id="info-text" class="text-xs text-slate-300">Đang kiểm tra Camera...</span>
    </div>

    <!-- Dropdown Chọn Camera & Nút Chuyển Nhanh -->
    <div class="flex gap-2">
      <select id="camera-select" onchange="switchSelectedCamera()" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
        <option value="">-- Đang liệt kê Camera --</option>
      </select>
      <button onclick="cycleNextCamera()" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-2 rounded-lg font-bold text-white shadow flex items-center gap-1">
        🔄 Đổi Ống Kính
      </button>
    </div>
  </div>

  <!-- Camera Viewport Area -->
  <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
    <video id="webcam" autoplay playsinline muted webkit-playsinline class="w-full h-full object-cover"></video>
    <canvas id="canvas" class="absolute inset-0 w-full h-full object-cover pointer-events-none"></canvas>

    <!-- Overlay Nút Bật Camera -->
    <div id="start-overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center z-20 space-y-4">
      <div class="w-20 h-20 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center text-4xl animate-pulse">📷</div>
      <h2 class="text-xl font-black text-white">Kết Nối Camera Máy Tính Bảng</h2>
      <p class="text-xs text-slate-300 max-w-xs leading-relaxed">
        Nhấn nút bên dưới để khởi động camera quét thẻ.
      </p>
      <button onclick="startTabletCamera()" class="bg-green-600 hover:bg-green-500 text-white font-black text-base px-8 py-3.5 rounded-2xl shadow-xl transition-all transform active:scale-95">
        🚀 BẬT CAMERA QUÉT
      </button>
    </div>

    <!-- Thanh Thông Số Debug Trực Tiếp trên màn hình -->
    <div class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur px-2.5 py-1.5 rounded-lg text-[10px] text-slate-300 border border-slate-700 pointer-events-none z-10">
      <div>Độ phân giải: <span id="res-debug" class="text-green-400 font-bold">0x0</span></div>
      <div>Ống kính: <span id="cam-name-debug" class="text-yellow-400 font-bold">Chưa chọn</span></div>
    </div>
  </div>

  <!-- Footer Info Bar -->
  <div class="p-3 bg-slate-900 border-t border-slate-800 flex justify-between items-center text-xs z-10">
    <div class="flex items-center space-x-2">
      <span class="text-slate-400">Đã quét:</span>
      <span id="scanned-count" class="font-extrabold text-green-400 text-sm">0</span>
    </div>
    <span id="last-scan" class="text-slate-400 truncate max-w-[220px]">Chưa nhận diện thẻ</span>
  </div>

  <script>
    window.currentStream = null;
    window.activeSession = null;
    window.detector = null;
    window.videoDevices = [];
    window.currentCamIndex = 0;

    const firebaseConfig = { databaseURL: "https://plicked-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cameraSelect = document.getElementById('camera-select');
    const camStatus = document.getElementById('cam-status');
    const infoText = document.getElementById('info-text');
    const startOverlay = document.getElementById('start-overlay');
    const resDebug = document.getElementById('res-debug');
    const camNameDebug = document.getElementById('cam-name-debug');

    db.ref('activeSession').on('value', (snapshot) => {
      window.activeSession = snapshot.val();
      if (window.activeSession && window.activeSession.status === 'scanning') {
        infoText.innerText = "Phiên quét ĐANG MỞ";
        infoText.className = "text-xs text-green-400 font-semibold";
      } else {
        infoText.innerText = "⚠️ Nhìn thấy thẻ nhưng Admin chưa mở quét";
        infoText.className = "text-xs text-yellow-400 font-semibold";
      }
    });

    async function startTabletCamera() {
      camStatus.className = "w-2.5 h-2.5 rounded-full bg-yellow-500 animate-ping inline-block";

      if (window.currentStream) {
        window.currentStream.getTracks().forEach(t => t.stop());
        window.currentStream = null;
      }

      if (!window.detector && typeof AR !== 'undefined') {
        window.detector = new AR.Detector();
      }

      try {
        // Xin luồng video cơ bản trước
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        window.currentStream = stream;
        video.srcObject = stream;
        await video.play();

        startOverlay.classList.add('hidden');
        camStatus.className = "w-2.5 h-2.5 rounded-full bg-green-500 inline-block";

        // Tải danh sách thiết bị camera
        await populateCameraList();
        requestAnimationFrame(tick);
      } catch (err) {
        camStatus.className = "w-2.5 h-2.5 rounded-full bg-red-500 inline-block";
        alert("Không thể bật Camera: " + err.message);
      }
    }

    async function populateCameraList() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        window.videoDevices = devices.filter(d => d.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        if (window.videoDevices.length === 0) {
          cameraSelect.innerHTML = '<option value="">Không tìm thấy Camera</option>';
          return;
        }

        window.videoDevices.forEach((device, index) => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          opt.text = device.label || `Camera ${index + 1}`;
          cameraSelect.appendChild(opt);
        });

        // Tìm ưu tiên camera sau (back/rear/environment)
        let backCamIndex = window.videoDevices.findIndex(d => {
          const lbl = (d.label || '').toLowerCase();
          return lbl.includes('back') || lbl.includes('rear') || lbl.includes('environment') || lbl.includes('sau');
        });

        // Nếu không ghi tên, mặc định chọn camera cuối cùng (thường là camera sau trên Android)
        if (backCamIndex === -1 && window.videoDevices.length > 1) {
          backCamIndex = window.videoDevices.length - 1;
        } else if (backCamIndex === -1) {
          backCamIndex = 0;
        }

        window.currentCamIndex = backCamIndex;
        cameraSelect.selectedIndex = backCamIndex;

        // Chuyển sang camera sau chuẩn
        if (window.videoDevices.length > 1) {
          await switchCameraByIndex(backCamIndex);
        }
      } catch (e) {
        console.warn(e);
      }
    }

    async function cycleNextCamera() {
      if (!window.videoDevices || window.videoDevices.length === 0) return;
      window.currentCamIndex = (window.currentCamIndex + 1) % window.videoDevices.length;
      cameraSelect.selectedIndex = window.currentCamIndex;
      await switchCameraByIndex(window.currentCamIndex);
    }

    async function switchSelectedCamera() {
      const idx = cameraSelect.selectedIndex;
      if (idx !== -1) {
        window.currentCamIndex = idx;
        await switchCameraByIndex(idx);
      }
    }

    async function switchCameraByIndex(index) {
      const device = window.videoDevices[index];
      if (!device) return;

      if (window.currentStream) {
        window.currentStream.getTracks().forEach(t => t.stop());
      }

      camNameDebug.innerText = device.label || `Camera ${index + 1}`;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: device.deviceId } }
        });
        window.currentStream = stream;
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        // Fallback nếu exact deviceId bị từ chối
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: { deviceId: device.deviceId }
          });
          window.currentStream = fallbackStream;
          video.srcObject = fallbackStream;
          await video.play();
        } catch (e) {
          alert("Không thể chuyển sang ống kính này: " + e.message);
        }
      }
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
        // Cập nhật thông số độ phân giải lên màn hình
        resDebug.innerText = `${video.videoWidth}x${video.videoHeight}`;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Chụp ảnh khung hình
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        if (window.detector) {
          const markers = window.detector.detect(imageData);
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (markers && markers.length > 0) {
            drawMarkersAndProcess(markers);
          }
        }
      }
      requestAnimationFrame(tick);
    }

    function drawMarkersAndProcess(markers) {
      markers.forEach(marker => {
        const corners = marker.corners;
        const id = marker.id;

        // Vẽ khung viền xanh quanh thẻ ArUco
        ctx.beginPath();
        ctx.strokeStyle = "#22c55e";
        ctx.lineWidth = 5;
        ctx.moveTo(corners[0].x, corners[0].y);
        for (let i = 1; i < corners.length; i++) {
          ctx.lineTo(corners[i].x, corners[i].y);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.fillStyle = "#22c55e";
        ctx.font = "bold 24px sans-serif";
        ctx.fillText(`ID: ${id}`, corners[0].x, corners[0].y - 12);

        // Tính góc xoay thẻ
        const dx = corners[1].x - corners[0].x;
        const dy = corners[1].y - corners[0].y;
        let angle = Math.atan2(dy, dx) * (180 / Math.PI);

        let answer = "A";
        if (angle >= -45 && angle < 45) answer = "A";
        else if (angle >= 45 && angle < 135) answer = "B";
        else if (angle >= -135 && angle < -45) answer = "D";
        else answer = "C";

        if (window.activeSession && window.activeSession.status === 'scanning') {
          db.ref(`activeSession/responses/${id}`).set(answer);
          document.getElementById('last-scan').innerText = `✅ Nhận thẻ STT ${id}: Đáp án ${answer}`;
        } else {
          document.getElementById('last-scan').innerText = `👀 Phát hiện thẻ ID ${id} (Đáp án ${answer})`;
        }
      });
    }

    window.addEventListener('load', () => {
      // Tự động kiểm tra khi tải
    });
  </script>
</body>
</html>
